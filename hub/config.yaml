name: Bambu Hub
version: "1.2.0"
slug: bambu_hub
# Built and pushed by .github/workflows/hub.yml on main; HA pulls <image>:<version>.
image: ghcr.io/marionebl/ha-bambu-hub-{arch}
description: Bambu cloud bridge, Bambu Studio slicer and print sender in one app, through Home Assistant ingress
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
discovery: [bambu_sender]
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-3d
panel_title: Printers
homeassistant_api: true
hassio_api: true
map: ["share:rw"]
panel_admin: false
