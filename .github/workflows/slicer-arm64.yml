name: Bambu Studio on arm64
on:
  push:
    branches: [slicer-arm64-spike]
  workflow_dispatch:
jobs:
  slice:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Runner
        run: lscpu | grep -E 'Model name|^CPU\(s\)'; free -g
      - name: Install Flathub Bambu Studio
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq flatpak >/dev/null
          sudo tools/bambu-studio/arm64/flatpak-app.sh "$RUNNER_TEMP/bs"
      - name: Slice cube (H2S) and test plate (H2S Better, P1S Better)
        env:
          BS_APP: ${{ runner.temp }}/bs
        run: |
          set -x
          ldd_out=$("$BS_APP/bin/bambu-studio" --help 2>&1 | head -5) || true; echo "$ldd_out"
          t() { local s=$(date +%s); "$@"; echo "TIME $(( $(date +%s) - s ))s: $*"; }
          t tools/bambu-studio/bin/slice.sh tools/slicer/cube20.stl out/cube
          t env PROCESS="0.20mm Standard @BBL H2S" tools/bambu-studio/bin/slice.sh tools/bambu-studio/test/test_plate_v3.1.3mf out/h2s "Bambu PETG HF @BBL H2S"
          t env PRINTER="Bambu Lab P1S 0.4 nozzle" PROCESS="0.20mm Standard @BBL X1C" BED="Textured PEI Plate" tools/bambu-studio/bin/slice.sh tools/bambu-studio/test/test_plate_v3.1.3mf out/p1s "Bambu PETG HF @BBL P1S 0.4 nozzle"
          for f in out/*/*.gcode.3mf; do echo "== $f"; unzip -p "$f" Metadata/slice_info.config | grep -E 'prediction|weight|printer_model_id'; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slices
          path: out/
          retention-days: 3
