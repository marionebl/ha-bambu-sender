name: Changelog
on:
  push:
    branches: [main]
    paths: ['**/config.yaml', '**/CHANGELOG.md', 'tools/check-changelog.sh', '.github/workflows/changelog.yml']
  pull_request:
    paths: ['**/config.yaml', '**/CHANGELOG.md', 'tools/check-changelog.sh', '.github/workflows/changelog.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check-changelog.sh
