<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bambu Slicer</title>
<style>
:root { --bg:#f5f6f8; --card:#fff; --fg:#1c1f24; --muted:#667085; --line:#e3e6ea; --accent:#0a7d4d; --accent-fg:#fff; --err:#b42318; --warn:#b54708; }
@media (prefers-color-scheme: dark) { :root { --bg:#111315; --card:#1b1e22; --fg:#e8eaed; --muted:#98a2b3; --line:#2c3138; --accent:#2fb67a; --accent-fg:#06130d; --err:#f97066; --warn:#fdb022; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width:980px; margin:0 auto; padding:16px; }
h1 { font-size:20px; margin:4px 0 12px; }
.steps { display:flex; gap:8px; margin-bottom:12px; }
.steps button { flex:1; padding:10px; border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:10px; font:inherit; cursor:pointer; }
.steps button.on { color:var(--fg); border-color:var(--accent); box-shadow:inset 0 -3px 0 var(--accent); }
.steps button:disabled { opacity:.45; cursor:default; }
section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
label.h { display:block; font-weight:600; margin:14px 0 6px; }
label.h:first-child { margin-top:0; }
.drop { border:2px dashed var(--line); border-radius:12px; padding:24px; text-align:center; color:var(--muted); cursor:pointer; }
.drop.over { border-color:var(--accent); }
.row { display:flex; flex-wrap:wrap; gap:8px; }
.chip { display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:transparent; color:var(--fg); font:inherit; }
.chip.on { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); }
.chip:disabled { opacity:.45; cursor:default; }
.dot { width:16px; height:16px; border-radius:50%; border:1px solid var(--line); }
select { font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
.go { margin-top:16px; padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:var(--accent-fg); font:inherit; font-weight:600; cursor:pointer; }
.go:disabled { opacity:.4; cursor:default; }
.muted { color:var(--muted); }
.err { color:var(--err); white-space:pre-wrap; }
.warn { color:var(--warn); }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; margin:12px 0; }
.stat { border:1px solid var(--line); border-radius:10px; padding:10px; }
.stat b { display:block; font-size:20px; }
.view { display:grid; grid-template-columns:1fr; gap:12px; }
@media (min-width:760px) { .view { grid-template-columns:260px 1fr; } }
.view img { width:100%; border-radius:10px; border:1px solid var(--line); background:#ebebeb; }
canvas { width:100%; aspect-ratio:1; border-radius:10px; border:1px solid var(--line); background:#15181c; display:block; }
input[type=range] { width:100%; }
pre { white-space:pre-wrap; font-size:12px; max-height:200px; overflow:auto; background:var(--bg); padding:8px; border-radius:8px; }
.legend { display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--muted); margin-top:6px; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:middle; }
.spin { display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:s 1s linear infinite; vertical-align:-2px; margin-right:6px; }
@keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1>Bambu Slicer</h1>
  <div class="steps">
    <button id="t-prepare" class="on">1 · Prepare</button>
    <button id="t-preview" disabled>2 · Preview</button>
    <button id="t-print" disabled>3 · Print</button>
  </div>

  <section id="s-prepare">
    <label class="h">Model</label>
    <div id="drop" class="drop">Drop an STL, 3MF, OBJ or STEP file here, or click to choose one.<input id="file" type="file" accept=".stl,.3mf,.obj,.step,.stp" hidden></div>
    <div id="upload-msg" class="muted"></div>
    <label class="h">Printer</label>
    <div id="printers" class="row"><span class="muted"><span class="spin"></span>Reading printers…</span></div>
    <label class="h">Quality</label>
    <div id="quality" class="row"></div>
    <label class="h">Filament (AMS tray)</label>
    <div id="trays" class="row"><span class="muted">Pick a printer first.</span></div>
    <label class="h">Plate</label>
    <select id="bed"></select>
    <div><button id="slice" class="go" disabled>Slice</button></div>
    <div id="prepare-err" class="err"></div>
  </section>

  <section id="s-preview" hidden>
    <div id="slicing"></div>
    <div id="result" hidden>
      <div class="stats" id="stats"></div>
      <div id="warnings" class="warn"></div>
      <div class="view">
        <div><img id="plate" alt="Plate preview"><p class="muted" id="settings"></p></div>
        <div>
          <canvas id="gc" width="900" height="900"></canvas>
          <input id="layer" type="range" min="0" max="0" value="0">
          <div class="muted" id="layer-label">Loading G-code…</div>
          <div class="legend" id="legend"></div>
        </div>
      </div>
      <button id="to-print" class="go">Continue to print</button>
    </div>
  </section>

  <section id="s-print" hidden>
    <p id="print-summary"></p>
    <label class="chip" style="display:inline-flex"><input type="checkbox" id="ready"> The plate is clear and the right filament is loaded.</label>
    <div class="row" style="margin-top:8px">
      <label class="chip"><input type="checkbox" id="timelapse"> Timelapse</label>
      <label class="chip"><input type="checkbox" id="force"> Send even if the printer reports it is busy</label>
    </div>
    <div><button id="send" class="go" disabled>Send to printer</button></div>
    <div id="print-msg"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const api = (path, opt) => fetch(path, opt).then(async r => {
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || ("HTTP " + r.status));
  return body;
});
const state = { job: null, printers: [], printer: null, quality: "better", tray: null };
const LABEL = { good: "Good", better: "Better", best: "Best" };

function tab(name) {
  for (const n of ["prepare", "preview", "print"]) {
    $("s-" + n).hidden = n !== name;
    $("t-" + n).classList.toggle("on", n === name);
  }
}
for (const n of ["prepare", "preview", "print"]) $("t-" + n).onclick = () => tab(n);

function fmtTime(s) { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? `${h} h ${m} min` : `${m} min`; }
function chip(html, on, click, disabled) {
  const b = document.createElement("button");
  b.className = "chip" + (on ? " on" : ""); b.innerHTML = html; b.onclick = click; b.disabled = !!disabled; return b;
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function render() {
  const pr = $("printers"); pr.innerHTML = "";
  for (const p of state.printers) pr.append(chip(`${esc(p.name)} <span class="muted">${esc(p.model)}</span>`, state.printer === p, () => { state.printer = p; state.tray = null; $("bed").value = p.bed; render(); }));
  if (!state.printers.length) pr.innerHTML = '<span class="muted">No supported printer (H2S, P1S) in Bambu Sender.</span>';
  const q = $("quality"); q.innerHTML = "";
  for (const k of ["good", "better", "best"]) q.append(chip(LABEL[k], state.quality === k, () => { state.quality = k; render(); }));
  const tr = $("trays"); tr.innerHTML = "";
  if (state.printer) {
    for (const t of state.printer.trays) {
      const key = t.ams + ":" + t.id;
      tr.append(chip(`<span class="dot" style="background:${esc(t.colour)}"></span>${Number(t.id) + 1} · ${esc(t.name)}`, state.tray === key, () => { state.tray = key; render(); }));
    }
    if (!state.printer.trays.length) tr.innerHTML = '<span class="muted">No AMS trays reported. Is the printer online?</span>';
  }
  $("slice").disabled = !(state.job && state.printer && state.tray);
}

async function loadPrinters() {
  try {
    const d = await api("api/printers");
    state.printers = d.printers;
    $("bed").innerHTML = d.beds.map(b => `<option>${esc(b)}</option>`).join("");
    if (state.printers.length === 1) { state.printer = state.printers[0]; $("bed").value = state.printer.bed; }
  } catch (e) { $("printers").innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
  render();
}

async function upload(file) {
  $("upload-msg").innerHTML = `<span class="spin"></span>Uploading ${esc(file.name)}…`;
  try {
    state.job = await api("api/jobs?name=" + encodeURIComponent(file.name), { method: "POST", body: file });
    $("upload-msg").textContent = `${file.name} (${(file.size / 1048576).toFixed(1)} MB) is ready.`;
    $("t-preview").disabled = $("t-print").disabled = true;
  } catch (e) { $("upload-msg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  render();
}
$("drop").onclick = () => $("file").click();
$("file").onchange = e => e.target.files[0] && upload(e.target.files[0]);
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("over"); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); };

$("slice").onclick = async () => {
  $("prepare-err").textContent = "";
  try {
    state.job = await api(`api/jobs/${state.job.id}/slice`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ serial: state.printer.serial, quality: state.quality, tray: state.tray, bed: $("bed").value }) });
  } catch (e) { $("prepare-err").textContent = e.message; return; }
  $("t-preview").disabled = false; $("t-print").disabled = true; $("result").hidden = true;
  tab("preview"); poll();
};

async function poll() {
  const j = state.job = await api(`api/jobs/${state.job.id}`).catch(e => ({ state: "failed", error: e.message }));
  if (j.state === "queued" || j.state === "slicing") {
    $("slicing").innerHTML = `<p><span class="spin"></span>${j.state === "queued" ? "Waiting for the slicer…" : `Slicing ${esc(j.filename)} with Bambu Studio… ${j.elapsed || 0} s`}</p>`;
    return setTimeout(poll, 2000);
  }
  if (j.state === "failed") {
    $("slicing").innerHTML = `<p class="err">Slice failed: ${esc(j.error)}</p>${j.log ? `<pre>${esc(j.log)}</pre>` : ""}`;
    return;
  }
  $("slicing").innerHTML = "";
  showResult(j);
}

function showResult(j) {
  const i = j.info, s = j.settings;
  $("stats").innerHTML = [
    ["Print time", fmtTime(i.seconds)], ["Filament", i.grams.toFixed(1) + " g"],
    ["Quality", LABEL[j.quality]], ["Printer", esc(j.printer.name)],
  ].map(([k, v]) => `<div class="stat"><span class="muted">${k}</span><b>${v}</b></div>`).join("");
  $("warnings").innerHTML = (i.warnings || []).filter(Boolean).map(w => `<p>⚠ ${esc(w)}</p>`).join("");
  $("settings").textContent = `${s.process} · ${s.filament} · ${s.bed} · tray ${Number(s.tray.id) + 1}`;
  $("plate").src = `api/jobs/${j.id}/plate.png?${Date.now()}`;
  $("plate").hidden = !i.has_png;
  $("result").hidden = false; $("t-print").disabled = false;
  loadGcode(j.id);
  $("print-summary").innerHTML = `Send <b>${esc(j.filename)}</b> (${LABEL[j.quality]}, ${fmtTime(i.seconds)}, ${i.grams.toFixed(1)} g) to <b>${esc(j.printer.name)}</b>, tray ${Number(s.tray.id) + 1} (${esc(s.tray.name)}).`;
  $("print-msg").innerHTML = ""; $("ready").checked = false; $("send").disabled = true;
}
$("to-print").onclick = () => tab("print");

// --- G-code layer view: top-down, current layer bright, the one below dim ---
const FEATURE = { "Outer wall": "#ff8a3d", "Inner wall": "#ffd166", "Sparse infill": "#c86bfa", "Internal solid infill": "#9b5de5",
  "Top surface": "#ef476f", "Bottom surface": "#4cc9f0", "Bridge": "#06d6a0", "Support": "#8ecae6", "Support interface": "#219ebc",
  "Brim": "#adb5bd", "Skirt": "#adb5bd", "Gap infill": "#f4a261", "Overhang wall": "#2a9d8f", "Prime tower": "#6c757d" };
let layers = [], bounds = null;

async function loadGcode(id) {
  $("layer-label").textContent = "Loading G-code…";
  const text = await fetch(`api/jobs/${id}/plate.gcode`).then(r => r.text());
  layers = []; let cur = null, x = 0, y = 0, z = 0, feat = "", relE = true;
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  const newLayer = () => { cur = { z, segs: {} }; layers.push(cur); };
  for (const raw of text.split("\n")) {
    if (raw.startsWith(";")) {
      if (raw.startsWith("; CHANGE_LAYER") || raw.startsWith(";LAYER_CHANGE")) newLayer();
      else if (raw.startsWith("; FEATURE: ") || raw.startsWith(";TYPE:")) feat = raw.slice(raw.indexOf(":") + 1).trim();
      else if (raw.startsWith("; Z_HEIGHT: ") && cur) cur.z = parseFloat(raw.slice(12));
      continue;
    }
    const line = raw.split(";")[0].trim();
    if (!line) continue;
    const cmd = line.split(" ", 1)[0];
    if (cmd === "M82") { relE = false; continue; }
    if (cmd === "M83") { relE = true; continue; }
    if (cmd !== "G1" && cmd !== "G0" && cmd !== "G2" && cmd !== "G3") continue;
    const p = {};
    for (const w of line.split(" ").slice(1)) if (w) p[w[0]] = parseFloat(w.slice(1));
    const nx = p.X ?? x, ny = p.Y ?? y;
    if (p.Z !== undefined) z = p.Z;
    const extruding = p.E !== undefined && p.E > 0 && relE;
    if (extruding && cur && feat) {
      const arr = cur.segs[feat] || (cur.segs[feat] = []);
      if ((cmd === "G2" || cmd === "G3") && p.I !== undefined) {
        const cx = x + (p.I || 0), cy = y + (p.J || 0), r = Math.hypot(x - cx, y - cy);
        let a0 = Math.atan2(y - cy, x - cx), a1 = Math.atan2(ny - cy, nx - cx);
        if (cmd === "G3" && a1 <= a0) a1 += 2 * Math.PI;
        if (cmd === "G2" && a1 >= a0) a1 -= 2 * Math.PI;
        const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) * r / 0.5));
        let px = x, py = y;
        for (let k = 1; k <= n; k++) { const a = a0 + (a1 - a0) * k / n, qx = cx + r * Math.cos(a), qy = cy + r * Math.sin(a); arr.push(px, py, qx, qy); px = qx; py = qy; }
      } else arr.push(x, y, nx, ny);
      minX = Math.min(minX, x, nx); maxX = Math.max(maxX, x, nx); minY = Math.min(minY, y, ny); maxY = Math.max(maxY, y, ny);
    }
    x = nx; y = ny;
  }
  layers = layers.filter(l => Object.keys(l.segs).length);
  if (!layers.length) { $("layer-label").textContent = "The G-code has no layers to show."; return; }
  const pad = 5, span = Math.max(maxX - minX, maxY - minY) + 2 * pad;
  bounds = { x: (minX + maxX) / 2 - span / 2, y: (minY + maxY) / 2 - span / 2, span };
  $("layer").max = layers.length - 1; $("layer").value = layers.length - 1;
  const used = new Set(layers.flatMap(l => Object.keys(l.segs)));
  $("legend").innerHTML = [...used].map(f => `<span><i style="background:${FEATURE[f] || "#ddd"}"></i>${esc(f)}</span>`).join("");
  drawLayer();
}

function drawLayer() {
  const c = $("gc"), g = c.getContext("2d"), n = +$("layer").value, W = c.width;
  g.clearRect(0, 0, W, W);
  const k = W / bounds.span, tx = v => (v - bounds.x) * k, ty = v => W - (v - bounds.y) * k;
  const stroke = (layer, alpha) => {
    for (const [f, a] of Object.entries(layer.segs)) {
      g.strokeStyle = FEATURE[f] || "#ddd"; g.globalAlpha = alpha; g.lineWidth = Math.max(1, 0.42 * k); g.beginPath();
      for (let i = 0; i < a.length; i += 4) { g.moveTo(tx(a[i]), ty(a[i + 1])); g.lineTo(tx(a[i + 2]), ty(a[i + 3])); }
      g.stroke();
    }
  };
  if (n > 0) stroke(layers[n - 1], 0.18);
  stroke(layers[n], 1);
  g.globalAlpha = 1;
  $("layer-label").textContent = `Layer ${n + 1} of ${layers.length} · Z ${layers[n].z.toFixed(2)} mm`;
}
$("layer").oninput = drawLayer;

// --- Print ---
$("ready").onchange = () => { $("send").disabled = !$("ready").checked; };
$("send").onclick = async () => {
  const j = state.job;
  if (!confirm(`Start printing ${j.filename} on ${j.printer.name} now?`)) return;
  $("send").disabled = true; $("print-msg").innerHTML = '<p><span class="spin"></span>Sending…</p>';
  try {
    const r = await api(`api/jobs/${j.id}/print`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ confirm: true, timelapse: $("timelapse").checked, force: $("force").checked }) });
    $("print-msg").innerHTML = `<p>Sent ${esc(r.file)} to ${esc(j.printer.name)}. Watch the printer on the Printers dashboard.</p>`;
  } catch (e) { $("print-msg").innerHTML = `<p class="err">Not sent: ${esc(e.message)}</p>`; $("send").disabled = false; }
};

loadPrinters();
</script>
</body>
</html>
